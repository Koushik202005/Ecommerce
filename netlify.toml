[build]
command = "npm run build"
publish = "public"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"

[functions]
node_bundler = "esbuild"
included_files = ["server/schema.sql", "server/seed-data.json"]

[[redirects]]
from = "/admin"
to = "/index.html"
status = 200

[[redirects]]
from = "/admin/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/products/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/collections/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/store/*"
to = "/index.html"
status = 200
